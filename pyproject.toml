[project]
name = "keymesh"
version = "0.1.0"
description = "A lightweight, concurrency-safe credential orchestration runtime for AI API systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KeyMesh Contributors" }]
keywords = ["api-key", "rate-limit", "scheduler", "credential", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiofiles>=23.2.1",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.scripts]
keymesh = "keymesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[project]
name = "keymesh"
version = "0.2.0-beta.1"
description = "A transparent API key pool manager for the OpenAI SDK — rotates keys, tracks RPM windows, and handles 429 cooldowns automatically."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
all = [
    "keymesh[redis,postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keymesh"]

[dependency-groups]
dev = []
